name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate golden snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner}}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ffc857&color_dots=%23ebedf0,%23a8e6ff,%2356ccf2,%2300b4d8,%2300d4ff
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ffc857&color_dots=%2310233d,%231b4d6e,%230e7aa8,%2300b4d8,%2300e5ff

      - name: Push snake animation to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN}}
